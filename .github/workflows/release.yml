# Publishes a GitHub release when a version tag is pushed (git tag v1.4.0 && git push origin v1.4.0).
# Builds the Windows folder build, zips it and attaches it; notes come from the README changelog.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag must match __version__
        shell: pwsh
        run: |
          $v = python -c "import r2save; print(r2save.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match __version__ $v" }

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3

      - name: Build (folder)
        run: python -m PyInstaller --clean --noconfirm Remnant2SaveEditor.spec

      - name: Package
        shell: pwsh
        run: |
          $zip = "Remnant2SaveEditor-${{ github.ref_name }}-win64.zip"
          Compress-Archive -Path dist/Remnant2SaveEditor -DestinationPath $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$sha  $zip"
          "ZIP=$zip" >> $env:GITHUB_ENV
          "SHA=$sha" >> $env:GITHUB_ENV

      - name: Release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $count = gh release list --limit 1 --json tagName --jq length
          if ($count -eq "0") {
            python tools/release_notes.py "${{ github.ref_name }}" --zip $env:ZIP --sha $env:SHA --all -o notes.md
          } else {
            python tools/release_notes.py "${{ github.ref_name }}" --zip $env:ZIP --sha $env:SHA -o notes.md
          }
          Get-Content notes.md

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" $env:ZIP --title "Remnant 2 Save Editor ${{ github.ref_name }}" --notes-file notes.md
